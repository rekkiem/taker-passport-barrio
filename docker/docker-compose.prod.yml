# Overlay de producción. Se usa junto al compose base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Qué cambia respecto al compose de desarrollo:
#   - Ningún puerto interno queda expuesto a 0.0.0.0 (Postgres, Redis, MinIO,
#     Evolution API, backend). Solo el frontend, y solo a 127.0.0.1 — el
#     Nginx del HOST (fuera de Docker) es el único que escucha en 0.0.0.0:80/443
#     y hace de frontera pública real. Ver deploy/nginx-host.conf.
#   - Todos los servicios rotan logs (evita llenar el disco de un VPS chico).
#   - Límites de memoria por contenedor, pensados para un droplet de 2GB RAM.
#   - restart: always (en vez de unless-stopped) — el VPS debe recuperarse
#     solo después de un reinicio o falla del host.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 384m

  redis:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 96m

  minio:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    mem_limit: 256m

  evolution-api:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 384m

  backend:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:4000:4000"
    mem_limit: 384m
    environment:
      - NODE_ENV=production

  frontend:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 128m

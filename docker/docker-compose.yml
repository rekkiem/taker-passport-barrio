services:
  postgres:
    build: ../database
    environment:
      POSTGRES_DB: taker
      POSTGRES_USER: taker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-takerpass2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ../backend
    environment:
      - DATABASE_URL=postgresql://taker:${DB_PASSWORD:-takerpass2026}@postgres:5432/taker
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey2026}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
      - MINIO_PUBLIC_URL=http://localhost:9000
      - WEBPAY_COMMERCE_CODE=TBK
      - WEBPAY_SECRET=${WEBPAY_SECRET:-testsecret}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-default}
      - FRONTEND_URL=http://localhost
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build: ../frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  minio_data:
name: taker-passport-barrio
# Nombre de proyecto fijo: si esta carpeta se llama igual que la de otro
# stack de Docker Compose en el mismo servidor (ej. "docker/" en el proyecto
# de Divinittys), Compose podría intentar reusar o chocar con esos
# contenedores/red. Fijar el nombre evita esa ambigüedad.

services:
  postgres:
    build: ../database
    environment:
      POSTGRES_DB: taker
      POSTGRES_USER: taker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?falta MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?falta MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?falta EVOLUTION_API_KEY}
      - DATABASE_ENABLED=false
      - DEL_INSTANCE=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      - LOG_LEVEL=ERROR,WARN
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    depends_on:
      - redis

  backend:
    build: ../backend
    environment:
      - DATABASE_URL=postgresql://taker:${DB_PASSWORD}@postgres:5432/taker
      - JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - WEBPAY_COMMERCE_CODE=TBK
      - WEBPAY_SECRET=${WEBPAY_SECRET:-}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-}
      - PAYMENTS_MODE=${PAYMENTS_MODE:-manual}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-2}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      evolution-api:
        condition: service_started

  frontend:
    build: ../frontend
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  evolution_store:
  evolution_instances:
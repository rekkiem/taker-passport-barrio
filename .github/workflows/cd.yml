name: CD (deploy a producción)

# Deshabilitado hasta configurar los secrets del repo (Settings → Secrets and
# variables → Actions). Si los secrets no existen, este workflow se salta el
# despliegue sin fallar el pipeline. Ver docs/DEPLOY_VULTR.md, sección CD.
#
# Secrets requeridos:
#   VPS_HOST       IP o dominio del servidor
#   VPS_USER       usuario de despliegue (no root), ej: taker
#   VPS_SSH_KEY    llave privada SSH (formato PEM) con acceso a ese usuario
#   VPS_DOMAIN     dominio de producción, ej: takerpass.cl

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que los secrets estén configurados
        id: check
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Secrets de despliegue no configurados — se omite el deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy por SSH
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/taker-passport-barrio
            git pull origin main
            cd docker
            if command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi
            $COMPOSE_CMD -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f
